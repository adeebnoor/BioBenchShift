name: gate1-biosnap-dti

on:
  push:
    branches:
      - main
    paths:
      - analysis/run_biosnap_dti_gate1.py
      - .github/workflows/gate1_biosnap.yml
      - gate1.trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  biosnap-dti:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install pandas numpy

      - name: Acquire canonical BioSNAP TargetDecagon DTI file
        run: |
          mkdir -p external_data results
          curl -fL --retry 4 --retry-delay 2 \
            https://snap.stanford.edu/biodata/datasets/10015/files/ChG-TargetDecagon_targets.csv.gz \
            -o external_data/ChG-TargetDecagon_targets.csv.gz
          sha256sum external_data/ChG-TargetDecagon_targets.csv.gz | tee results/biosnap_targetdecagon.sha256
          gzip -t external_data/ChG-TargetDecagon_targets.csv.gz
          echo '--- first five decompressed lines (visible delimiters) ---'
          zcat external_data/ChG-TargetDecagon_targets.csv.gz | head -5 | cat -A || true

      - name: Run prespecified model-free Gate 1 audit
        run: |
          python analysis/run_biosnap_dti_gate1.py \
            --input external_data/ChG-TargetDecagon_targets.csv.gz \
            --out-csv results/biosnap_dti_gate1_replicates.csv \
            --out-json results/biosnap_dti_gate1_summary.json \
            --out-md results/biosnap_dti_gate1.md \
            --replicates 20
          cat results/biosnap_dti_gate1.md

      - name: Commit frozen results and checksum
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/biosnap_targetdecagon.sha256 results/biosnap_dti_gate1_replicates.csv results/biosnap_dti_gate1_summary.json results/biosnap_dti_gate1.md
          if git diff --cached --quiet; then
            echo 'Results unchanged.'
          else
            git commit -m 'Record BioSNAP DTI Gate 1 results [skip ci]'
            git push origin HEAD:main
          fi
