name: h4-biogrid-temporal

on:
  push:
    branches: [main]
    paths:
      - analysis/run_biogrid_temporal_h4.py
      - .github/workflows/h4_biogrid_temporal.yml
      - h4.trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  temporal:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install dependencies
        run: |
          python -m pip install pandas numpy scipy scikit-learn
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Download frozen BioGRID snapshots
        run: |
          mkdir -p external_data results
          curl -fL --retry 4 --retry-delay 2 \
            https://downloads.thebiogrid.org/Download/BioGRID/Release-Archive/BIOGRID-5.0.250/BIOGRID-MV-Physical-5.0.250.tab3.zip \
            -o external_data/BIOGRID-MV-Physical-5.0.250.tab3.zip
          curl -fL --retry 4 --retry-delay 2 \
            https://downloads.thebiogrid.org/Download/BioGRID/Release-Archive/BIOGRID-5.0.261/BIOGRID-MV-Physical-5.0.261.tab3.zip \
            -o external_data/BIOGRID-MV-Physical-5.0.261.tab3.zip
          unzip -t external_data/BIOGRID-MV-Physical-5.0.250.tab3.zip >/dev/null
          unzip -t external_data/BIOGRID-MV-Physical-5.0.261.tab3.zip >/dev/null
          sha256sum external_data/BIOGRID-MV-Physical-5.0.250.tab3.zip external_data/BIOGRID-MV-Physical-5.0.261.tab3.zip > results/h4_biogrid_inputs.sha256
      - name: Run temporal H4 analysis
        run: |
          python analysis/run_biogrid_temporal_h4.py \
            --old external_data/BIOGRID-MV-Physical-5.0.250.tab3.zip \
            --new external_data/BIOGRID-MV-Physical-5.0.261.tab3.zip \
            --out-prefix results/h4_biogrid_temporal \
            --replicates 3
          cat results/h4_biogrid_temporal.md
      - name: Commit frozen H4 results with retry
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/h4_biogrid_inputs.sha256 results/h4_biogrid_temporal*
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record BioGRID temporal H4 validation results [skip ci]'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main || { git rebase --abort || true; exit 1; }
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
