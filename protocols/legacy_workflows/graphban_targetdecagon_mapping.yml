name: graphban-targetdecagon-mapping

on:
  push:
    branches: [main]
    paths:
      - analysis/probe_graphban_targetdecagon_mapping.py
      - .github/workflows/graphban_targetdecagon_mapping.yml
      - GRAPHBAN_PROTOCOL_AMENDMENT_20260913.md
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mapping:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install pandas requests
      - name: Acquire frozen TargetDecagon DTI input
        run: |
          mkdir -p external_data results
          curl -fL --retry 4 --retry-delay 2 https://snap.stanford.edu/biodata/datasets/10015/files/ChG-TargetDecagon_targets.csv.gz -o external_data/ChG-TargetDecagon_targets.csv.gz
          sha256sum external_data/ChG-TargetDecagon_targets.csv.gz | tee results/graphban_targetdecagon_input.sha256
      - name: Probe frozen feature-mapping gate
        run: |
          python analysis/probe_graphban_targetdecagon_mapping.py \
            --input external_data/ChG-TargetDecagon_targets.csv.gz \
            --out-prefix results/graphban_targetdecagon_mapping
          cat results/graphban_targetdecagon_mapping.md
      - name: Commit mapping preflight
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/graphban_targetdecagon_input.sha256 \
                  results/graphban_targetdecagon_mapping_drug_map.csv \
                  results/graphban_targetdecagon_mapping_gene_map.csv \
                  results/graphban_targetdecagon_mapping_summary.json \
                  results/graphban_targetdecagon_mapping.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record GraphBAN TargetDecagon mapping preflight [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
