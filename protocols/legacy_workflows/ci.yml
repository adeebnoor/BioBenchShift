name: validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Re-derive v2 published quantities
        run: python validate.py --verbose

      - name: Rebuild v3 release tables with conservative semantics and final anchor provenance
        run: |
          python build_v3.py
          python semantic_harden_v3.py
          python refresh_anchor_metadata.py

      - name: Validate v3 semantic and release invariants
        run: python validate_v3.py

      - name: Validate corrective ATC5 structural-bias outputs
        run: python analysis/validate_degree_bias_outputs.py

      - name: Ensure superseded experiment is marked withdrawn
        run: |
          grep -q "withdrawn" VALIDATION_NOTICE_20260820.md
          grep -q "not valid as evidence" paper5/PAPER5_RIDI_VALIDATION.md

      - name: Persist final submission tables on editorial release branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/release/commsmed-editorial-final'
        run: |
          if git diff --quiet -- data/antiddi_v3_dataset.csv data/antiddi_v3_benchmark.csv data/clinical_anchor_pairs.csv; then
            echo "Final submission tables already persisted."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/antiddi_v3_dataset.csv data/antiddi_v3_benchmark.csv data/clinical_anchor_pairs.csv
            git commit -m "Persist final clinical-anchor provenance"
            git push
          fi
