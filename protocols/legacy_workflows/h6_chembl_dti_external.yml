name: h6-chembl-dti-external

on:
  push:
    branches: [main]
    paths:
      - EXTERNAL_DTI_CHEMBL_PROTOCOL.md
      - analysis/run_chembl_dti_external.py
      - .github/workflows/h6_chembl_dti_external.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  external-dti:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install dependencies
        run: |
          python -m pip install pandas numpy scipy scikit-learn requests
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Acquire frozen BioSNAP input
        run: |
          mkdir -p external_data results
          curl -fL --retry 5 --retry-delay 2 \
            https://snap.stanford.edu/biodata/datasets/10015/files/ChG-TargetDecagon_targets.csv.gz \
            -o external_data/ChG-TargetDecagon_targets.csv.gz
          sha256sum external_data/ChG-TargetDecagon_targets.csv.gz > results/h6_chembl_biosnap_input.sha256
      - name: Run frozen ChEMBL 37 independent DTI validation
        run: |
          python analysis/run_chembl_dti_external.py \
            --biosnap external_data/ChG-TargetDecagon_targets.csv.gz \
            --out-prefix results/h6_chembl_dti_external \
            --inits 5
          cat results/h6_chembl_dti_external.md
      - name: Commit frozen external validation results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/h6_chembl_biosnap_input.sha256 results/h6_chembl_dti_external*
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record ChEMBL 37 independent DTI validation [skip ci]'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main || { git rebase --abort || true; exit 1; }
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
