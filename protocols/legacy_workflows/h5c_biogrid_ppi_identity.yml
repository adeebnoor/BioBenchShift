name: h5c-biogrid-ppi-identity

on:
  push:
    branches: [main]
    paths:
      - analysis/run_biogrid_h5_identity.py
      - analysis/run_biogrid_temporal_h4.py
      - .github/workflows/h5c_biogrid_ppi_identity.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ppi-h5:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install dependencies
        run: |
          python -m pip install pandas numpy scipy scikit-learn
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Download frozen BioGRID historical snapshot
        run: |
          mkdir -p external_data results
          curl -fL --retry 4 --retry-delay 2 https://downloads.thebiogrid.org/Download/BioGRID/Release-Archive/BIOGRID-5.0.250/BIOGRID-MV-Physical-5.0.250.tab3.zip -o external_data/BIOGRID-MV-Physical-5.0.250.tab3.zip
          sha256sum external_data/BIOGRID-MV-Physical-5.0.250.tab3.zip > results/h5c_biogrid_ppi_inputs.sha256
      - name: Run PPI hypothesis-identity ensemble stability analysis
        run: |
          python analysis/run_biogrid_h5_identity.py \
            --old external_data/BIOGRID-MV-Physical-5.0.250.tab3.zip \
            --out-prefix results/h5c_biogrid_ppi_identity \
            --inits 3
          cat results/h5c_biogrid_ppi_identity.md
      - name: Commit frozen PPI H5 results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/h5c_biogrid_ppi_inputs.sha256 results/h5c_biogrid_ppi_identity*
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record BioGRID PPI H5 hypothesis-identity stability [skip ci]'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main || { git rebase --abort || true; exit 1; }
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
