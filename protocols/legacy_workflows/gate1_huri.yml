name: gate1-huri-ppi

on:
  push:
    branches: [main]
    paths:
      - analysis/run_huri_ppi_gate1.py
      - .github/workflows/gate1_huri.yml
      - huri.trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  huri-ppi:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install pandas numpy
      - name: Acquire published HuRI interaction set
        run: |
          mkdir -p external_data results
          curl -fL --retry 4 --retry-delay 2 https://interactome-atlas.org/data/HuRI.tsv -o external_data/HuRI.tsv
          sha256sum external_data/HuRI.tsv | tee results/huri.sha256
          wc -l external_data/HuRI.tsv
          head -5 external_data/HuRI.tsv | cat -A
      - name: Run prespecified model-free Gate 1 audit
        run: |
          python analysis/run_huri_ppi_gate1.py \
            --input external_data/HuRI.tsv \
            --out-csv results/huri_ppi_gate1_replicates.csv \
            --out-json results/huri_ppi_gate1_summary.json \
            --out-md results/huri_ppi_gate1.md \
            --replicates 20
          cat results/huri_ppi_gate1.md
      - name: Commit frozen results and checksum
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/huri.sha256 results/huri_ppi_gate1_replicates.csv results/huri_ppi_gate1_summary.json results/huri_ppi_gate1.md
          if git diff --cached --quiet; then
            echo 'Results unchanged.'
          else
            git commit -m 'Record HuRI PPI Gate 1 results [skip ci]'
            git push origin HEAD:main
          fi
