name: gate1-hetionet-dag

on:
  push:
    branches: [main]
    paths:
      - analysis/run_hetionet_bipartite_gate1.py
      - .github/workflows/gate1_hetionet_dag.yml
      - dag.trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hetionet-dag:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install pandas numpy
      - name: Acquire frozen Hetionet v1.0 edges
        run: |
          mkdir -p external_data results
          curl -fL --retry 4 --retry-delay 2 https://media.githubusercontent.com/media/hetio/hetionet/main/hetnet/tsv/hetionet-v1.0-edges.sif.gz -o external_data/hetionet-v1.0-edges.sif.gz
          sha256sum external_data/hetionet-v1.0-edges.sif.gz | tee results/hetionet_v1_edges_dag.sha256
          gzip -t external_data/hetionet-v1.0-edges.sif.gz
      - name: Run DaG audit
        run: |
          python analysis/run_hetionet_bipartite_gate1.py --input external_data/hetionet-v1.0-edges.sif.gz --metaedge DaG --left-prefix 'Disease::' --right-prefix 'Gene::' --label 'Hetionet Disease-associates-Gene (DaG)' --out-prefix results/hetionet_dag_gate1 --replicates 20
          cat results/hetionet_dag_gate1.md
      - name: Commit results safely
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/hetionet_v1_edges_dag.sha256 results/hetionet_dag_gate1_replicates.csv results/hetionet_dag_gate1_summary.json results/hetionet_dag_gate1.md
          if git diff --cached --quiet; then
            echo unchanged
          else
            git commit -m 'Record Hetionet DaG Gate 1 results [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
