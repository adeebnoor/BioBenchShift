name: build-submission-package

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'paper/manuscript.md'
      - 'paper/supplementary_materials.md'
      - 'paper/cover_letter.md'
      - 'paper/cts_metadata.md'
      - 'paper/related_work_disclosure.md'
      - 'figures/source_data_main.csv'
      - 'analysis/build_science_figures.py'
      - '.github/workflows/build_submission_package.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas matplotlib
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Rebuild main figures from frozen source data
        run: python analysis/build_science_figures.py

      - name: Build submission DOCX files
        run: |
          mkdir -p paper/generated
          pandoc --from=gfm --resource-path=paper:figures/generated:. \
            paper/manuscript.md \
            -o paper/generated/Science_Research_Article_PRE_SUBMISSION.docx
          pandoc --from=gfm paper/supplementary_materials.md \
            -o paper/generated/Science_Supplementary_Materials_PRE_SUBMISSION.docx
          pandoc --from=gfm paper/cover_letter.md \
            -o paper/generated/Science_Cover_Letter.docx

      - name: Verify package
        run: |
          test -s paper/generated/Science_Research_Article_PRE_SUBMISSION.docx
          test -s paper/generated/Science_Supplementary_Materials_PRE_SUBMISSION.docx
          test -s paper/generated/Science_Cover_Letter.docx
          test -s figures/generated/Figure1_structural_observability.pdf
          test -s figures/generated/Figure2_hypothesis_identity.pdf
          test -s figures/generated/Figure3_biogrid_future_evidence.pdf
          test -s figures/generated/Figure4_chembl_frontier.pdf

      - name: Publish downloadable package
        uses: actions/upload-artifact@v4
        with:
          name: BioBenchShift-Science-pre-submission-package
          if-no-files-found: error
          retention-days: 30
          path: |
            paper/generated/*.docx
            paper/cts_metadata.md
            paper/related_work_disclosure.md
            paper/reviewer_candidates.md
            paper/file_manifest.md
            figures/generated/*.png
            figures/generated/*.pdf
            figures/source_data_main.csv
            CITATION.cff

      - name: Commit regenerated paper assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add paper/generated figures/generated
          if git diff --cached --quiet; then
            echo 'Generated assets unchanged.'
          else
            git pull --rebase origin main
            git commit -m 'Rebuild BioBenchShift submission package'
            git push origin main
          fi
