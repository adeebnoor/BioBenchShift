name: migrate-science-project

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrate_science_project.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout BioBenchShift
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch legacy Science branch
        run: |
          git clone --depth 1 --branch science-structural-shortcuts \
            https://github.com/adeebnoor/ANTI-DDI.git /tmp/legacy

      - name: Create Science-grade repository layout
        run: |
          mkdir -p analysis results figures paper/generated protocols .github/workflows

          # Executable paper analyses and frozen outputs.
          rsync -a /tmp/legacy/analysis/ analysis/
          rsync -a /tmp/legacy/results/ results/
          rsync -a /tmp/legacy/figures/ figures/

          # Paper-facing package.
          cp /tmp/legacy/manuscript/SCIENCE_MANUSCRIPT_v0.7_PRE_SUBMISSION.md paper/manuscript.md
          cp /tmp/legacy/submission/SCIENCE_COVER_LETTER.md paper/cover_letter.md
          cp /tmp/legacy/submission/SCIENCE_SUPPLEMENTARY_MATERIALS.md paper/supplementary_materials.md
          cp /tmp/legacy/submission/SCIENCE_CTS_METADATA.md paper/cts_metadata.md
          cp /tmp/legacy/submission/RELATED_WORK_DISCLOSURE.md paper/related_work_disclosure.md
          cp /tmp/legacy/submission/REVIEWER_CANDIDATES.md paper/reviewer_candidates.md
          cp /tmp/legacy/submission/FILE_MANIFEST.md paper/file_manifest.md
          if [ -d /tmp/legacy/submission/generated ]; then
            rsync -a /tmp/legacy/submission/generated/ paper/generated/
          fi

          # Prespecification, provenance, novelty and submission strategy.
          for f in \
            SCIENCE_PROJECT.md \
            RESULTS_CHECKPOINT_20260913.md \
            SCIENCE_SEND_DECISION.md \
            SCIENCE_SUBMISSION_STRATEGY_20260913.md \
            SCIENCE_LATEST_ARTICLE_ALIGNMENT_20260913.md \
            SCIENCE_EDITORIAL_SCREEN_PLAYBOOK_20260913.md \
            LITERATURE_GAP.md \
            BENCHMARK_MANIFEST.md \
            CHECKSUMS.sha256 \
            CONTEMPORARY_MODEL_CHALLENGE.md \
            EVIDENCE_STATE_OVERLAP_PROTOCOL.md \
            EXTERNAL_DTI_CHEMBL_PROTOCOL.md \
            GRAPHBAN_AUDIT_PROTOCOL.md \
            GRAPHBAN_PROTOCOL_AMENDMENT_20260913.md \
            RIDI_INTEGRATION.md; do
            if [ -f "/tmp/legacy/$f" ]; then cp "/tmp/legacy/$f" protocols/; fi
          done

          # Science-relevant reproducibility workflows only.
          for pattern in \
            'gate1_*.yml' 'gate2_*.yml' 'h4*.yml' 'h5*.yml' 'h6_*.yml' \
            'graphban_*.yml' 'probe_biogrid_temporal.yml' \
            'probe_chembl_dti_external.yml'; do
            for f in /tmp/legacy/.github/workflows/$pattern; do
              [ -f "$f" ] && cp "$f" .github/workflows/
            done
          done

          # Preserve the submission package builder but adapt its paths/repository branch.
          cp /tmp/legacy/.github/workflows/build_science_submission_package.yml \
             .github/workflows/build_submission_package.yml

          # Retain code/data licensing terms from the legacy research line.
          cp /tmp/legacy/LICENSE LICENSE

      - name: Rewrite legacy repository references
        run: |
          python - <<'PY'
          from pathlib import Path
          roots = [Path('paper'), Path('protocols'), Path('analysis'), Path('results'), Path('.github/workflows')]
          replacements = {
              'https://github.com/adeebnoor/ANTI-DDI/tree/science-structural-shortcuts': 'https://github.com/adeebnoor/BioBenchShift',
              'https://github.com/adeebnoor/ANTI-DDI': 'https://github.com/adeebnoor/BioBenchShift',
              'adeebnoor/ANTI-DDI': 'adeebnoor/BioBenchShift',
              'science-structural-shortcuts': 'main',
              'manuscript/SCIENCE_MANUSCRIPT_v0.7_PRE_SUBMISSION.md': 'paper/manuscript.md',
              'submission/SCIENCE_SUPPLEMENTARY_MATERIALS.md': 'paper/supplementary_materials.md',
              'submission/SCIENCE_COVER_LETTER.md': 'paper/cover_letter.md',
              'submission/generated': 'paper/generated',
          }
          exts = {'.md','.py','.yml','.yaml','.json','.cff','.txt','.csv','.sha256'}
          for root in roots:
              if not root.exists():
                  continue
              for p in root.rglob('*'):
                  if not p.is_file() or p.suffix.lower() not in exts:
                      continue
                  try:
                      s = p.read_text(encoding='utf-8')
                  except UnicodeDecodeError:
                      continue
                  old = s
                  for a,b in replacements.items(): s = s.replace(a,b)
                  if s != old: p.write_text(s, encoding='utf-8')
          PY

      - name: Install BioBenchShift citation metadata
        run: |
          cat > CITATION.cff <<'EOF'
          cff-version: 1.2.0
          message: >-
            If you use BioBenchShift, cite the archived release/commit and the
            accompanying peer-reviewed article when available.
          title: >-
            BioBenchShift: Benchmark design redirects biomedical discovery
          version: pre-submission-2026.09.13
          date-released: "2026-09-13"
          type: software
          license: MIT
          authors:
            - family-names: Noor
              given-names: Adeeb
              affiliation: >-
                Department of Information Technology, Faculty of Computing and Information
                Technology, King Abdulaziz University, Jeddah, Saudi Arabia
              email: arnoor@kau.edu.sa
              orcid: "https://orcid.org/0000-0002-8251-1853"
          repository-code: "https://github.com/adeebnoor/BioBenchShift"
          url: "https://github.com/adeebnoor/BioBenchShift"
          keywords:
            - biomedical artificial intelligence
            - benchmark design
            - model selection
            - hypothesis prioritization
            - network biology
            - drug-target interaction
            - protein-protein interaction
            - structural bias
            - reproducibility
          abstract: >-
            BioBenchShift is the pre-submission reproducibility package for a study
            testing whether biomedical AI benchmark construction changes model selection,
            hypothesis identity, and later or independent evidence concentrated among
            prioritized hypotheses.
          EOF

          cat > .zenodo.json <<'EOF'
          {
            "title": "BioBenchShift: Benchmark design redirects biomedical discovery",
            "upload_type": "software",
            "description": "Pre-submission reproducibility package linking biomedical AI benchmark construction to model selection, hypothesis identity, temporal BioGRID evidence and independent ChEMBL evidence.",
            "creators": [{"name":"Noor, Adeeb","orcid":"0000-0002-8251-1853","affiliation":"King Abdulaziz University"}],
            "keywords": ["biomedical artificial intelligence","benchmark design","model selection","hypothesis prioritization","network biology","reproducibility"],
            "version": "pre-submission-2026.09.13",
            "access_right": "open"
          }
          EOF

      - name: Add BioBenchShift CI
        run: |
          cat > .github/workflows/ci.yml <<'EOF'
          name: ci
          on:
            push:
            pull_request:
          jobs:
            smoke:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-python@v5
                  with:
                    python-version: '3.11'
                - run: python -m pip install --upgrade pip
                - run: pip install pandas matplotlib numpy scipy scikit-learn
                - name: Syntax check analysis scripts
                  run: python -m compileall -q analysis
                - name: Build main figures
                  run: python analysis/build_science_figures.py
                - name: Verify paper package
                  run: |
                    test -s paper/manuscript.md
                    test -s paper/supplementary_materials.md
                    test -s figures/source_data_main.csv
                    test -s figures/generated/Figure1_structural_observability.png
                    test -s figures/generated/Figure4_chembl_frontier.png
          EOF

      - name: Fix submission builder for BioBenchShift layout
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/build_submission_package.yml')
          s=p.read_text()
          s=s.replace("branches:\n      - main", "branches:\n      - main")
          s=s.replace("manuscript/SCIENCE_MANUSCRIPT_v0.7_PRE_SUBMISSION.md", "paper/manuscript.md")
          s=s.replace("submission/SCIENCE_SUPPLEMENTARY_MATERIALS.md", "paper/supplementary_materials.md")
          s=s.replace("submission/SCIENCE_COVER_LETTER.md", "paper/cover_letter.md")
          s=s.replace("submission/generated", "paper/generated")
          s=s.replace("--resource-path=manuscript:figures/generated:.", "--resource-path=paper:figures/generated:.")
          s=s.replace("submission/SCIENCE_CTS_METADATA.md", "paper/cts_metadata.md")
          s=s.replace("submission/RELATED_WORK_DISCLOSURE.md", "paper/related_work_disclosure.md")
          s=s.replace("submission/FILE_MANIFEST.md", "paper/file_manifest.md")
          p.write_text(s)
          PY

      - name: Commit migrated project
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Migrate Science project into standalone BioBenchShift repository'
          git push origin main
