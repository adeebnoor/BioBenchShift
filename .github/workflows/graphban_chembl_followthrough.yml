name: graphban-chembl-followthrough

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/graphban_chembl_followthrough.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  followthrough:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      GH_TOKEN: ${{ github.token }}
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen analysis environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numpy==1.26.4' pandas scipy scikit-learn requests
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.3.1
          python -m pip install torch-geometric==2.6.1
      - name: Recover frozen ChemBERTa and ESM-1b feature artifacts
        run: |
          mkdir -p feature_artifacts/protein feature_artifacts/drug feature_artifacts/combined external_data results
          for i in 0 1 2 3 4 5 6 7; do
            gh run download 34741559158 -n protein-$i -D feature_artifacts/protein
          done
          gh run download 34741559158 -n drug-features -D feature_artifacts/drug
      - name: Combine canonical protein features
        run: |
          N=$(python - <<'PY'
          import pandas as pd
          x=pd.read_csv('results/graphban_targetdecagon_mapping_gene_map.csv',dtype=str).fillna('')
          x=x[x.sequence.astype(bool)].drop_duplicates('gene')
          print(len(x))
          PY
          )
          python analysis/combine_graphban_features.py \
            --chunks feature_artifacts/protein/protein_chunk_*.npz \
            --n-rows "$N" --out feature_artifacts/combined/protein_features.npy
      - name: Acquire frozen TargetDecagon input
        run: |
          curl -fL --retry 4 --retry-delay 2 \
            https://snap.stanford.edu/biodata/datasets/10015/files/ChG-TargetDecagon_targets.csv.gz \
            -o external_data/ChG-TargetDecagon_targets.csv.gz
          sha256sum external_data/ChG-TargetDecagon_targets.csv.gz | tee results/graphban_chembl_targetdecagon_input.sha256
      - name: Run frozen fair-universe ChEMBL follow-through
        run: |
          python analysis/run_graphban_chembl_followthrough.py \
            --biosnap external_data/ChG-TargetDecagon_targets.csv.gz \
            --drug-map results/graphban_targetdecagon_mapping_drug_map.csv \
            --gene-map results/graphban_targetdecagon_mapping_gene_map.csv \
            --drug-features feature_artifacts/drug/drug_features.npy \
            --protein-features feature_artifacts/combined/protein_features.npy \
            --out-prefix results/graphban_chembl_followthrough \
            --inits 5
          cat results/graphban_chembl_followthrough.md
      - name: Commit frozen follow-through outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/graphban_chembl_targetdecagon_input.sha256 \
                  results/graphban_chembl_followthrough.md \
                  results/graphban_chembl_followthrough_summary.json \
                  results/graphban_chembl_followthrough_primary_table.csv \
                  results/graphban_chembl_followthrough_sensitivity_table.csv \
                  results/graphban_chembl_followthrough_eligible_activity_records.csv
          git commit -m 'Freeze GraphBAN ChEMBL follow-through [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
