name: graphban-chembl-parallel

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/graphban_chembl_parallel.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  graphban-fit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        fit: [0,1,2,3,4]
    env:
      GH_TOKEN: ${{ github.token }}
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install frozen GraphBAN environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numpy==1.26.4' pandas scipy scikit-learn requests
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.3.1
          python -m pip install torch-geometric==2.6.1
      - name: Recover frozen feature artifacts
        run: |
          mkdir -p feature_artifacts/protein feature_artifacts/drug feature_artifacts/combined external_data out
          for i in 0 1 2 3 4 5 6 7; do gh run download 34741559158 -n protein-$i -D feature_artifacts/protein; done
          gh run download 34741559158 -n drug-features -D feature_artifacts/drug
          N=$(python - <<'PY'
          import pandas as pd
          x=pd.read_csv('results/graphban_targetdecagon_mapping_gene_map.csv',dtype=str).fillna(''); x=x[x.sequence.astype(bool)].drop_duplicates('gene'); print(len(x))
          PY
          )
          python analysis/combine_graphban_features.py --chunks feature_artifacts/protein/protein_chunk_*.npz --n-rows "$N" --out feature_artifacts/combined/protein_features.npy
          curl -fL --retry 4 --retry-delay 2 https://snap.stanford.edu/biodata/datasets/10015/files/ChG-TargetDecagon_targets.csv.gz -o external_data/ChG-TargetDecagon_targets.csv.gz
      - name: Train one frozen full-graph GraphBAN fit and rank unknowns
        run: |
          python analysis/run_graphban_full_rank_one.py \
            --biosnap external_data/ChG-TargetDecagon_targets.csv.gz \
            --drug-map results/graphban_targetdecagon_mapping_drug_map.csv \
            --gene-map results/graphban_targetdecagon_mapping_gene_map.csv \
            --drug-features feature_artifacts/drug/drug_features.npy \
            --protein-features feature_artifacts/combined/protein_features.npy \
            --fit-index ${{ matrix.fit }} --out out/graphban_fit_${{ matrix.fit }}.npz
      - uses: actions/upload-artifact@v4
        with:
          name: graphban-rank-${{ matrix.fit }}
          path: out/graphban_fit_${{ matrix.fit }}.npz
          if-no-files-found: error
          retention-days: 7

  prep-evidence:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install frozen baseline/evidence environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numpy==1.26.4' pandas scipy scikit-learn requests
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.3.1
      - name: Prepare identical-universe ChEMBL evidence and baseline rankings
        run: |
          mkdir -p external_data prep
          curl -fL --retry 4 --retry-delay 2 https://snap.stanford.edu/biodata/datasets/10015/files/ChG-TargetDecagon_targets.csv.gz -o external_data/ChG-TargetDecagon_targets.csv.gz
          python analysis/prepare_fair_chembl_panel.py \
            --biosnap external_data/ChG-TargetDecagon_targets.csv.gz \
            --drug-map results/graphban_targetdecagon_mapping_drug_map.csv \
            --gene-map results/graphban_targetdecagon_mapping_gene_map.csv \
            --out-prefix prep/fair_chembl --inits 5
      - uses: actions/upload-artifact@v4
        with:
          name: fair-chembl-prep
          path: prep/*
          if-no-files-found: error
          retention-days: 7

  aggregate:
    if: github.actor != 'github-actions[bot]'
    needs: [graphban-fit, prep-evidence]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install aggregation environment
        run: python -m pip install 'numpy==1.26.4' pandas scipy scikit-learn requests
      - uses: actions/download-artifact@v4
        with:
          pattern: graphban-rank-*
          path: ranks
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: fair-chembl-prep
          path: prep
      - name: Acquire TargetDecagon and aggregate frozen result
        run: |
          mkdir -p external_data results
          curl -fL --retry 4 --retry-delay 2 https://snap.stanford.edu/biodata/datasets/10015/files/ChG-TargetDecagon_targets.csv.gz -o external_data/ChG-TargetDecagon_targets.csv.gz
          python analysis/aggregate_graphban_chembl_parallel.py \
            --biosnap external_data/ChG-TargetDecagon_targets.csv.gz \
            --drug-map results/graphban_targetdecagon_mapping_drug_map.csv \
            --gene-map results/graphban_targetdecagon_mapping_gene_map.csv \
            --score-glob 'ranks/graphban_fit_*.npz' \
            --prep-prefix prep/fair_chembl \
            --out-prefix results/graphban_chembl_followthrough_parallel
          cat results/graphban_chembl_followthrough_parallel.md
      - name: Commit frozen parallel result
        run: |
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/graphban_chembl_followthrough_parallel*
          git commit -m 'Freeze parallel GraphBAN ChEMBL follow-through [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
